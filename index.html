<!DOCTYPE html>
<html lang="fr" data-statique>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaire ONU-Habitat</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var langues = ["fr","en"], defaut = "fr";
      var voulues = (navigator.languages || [navigator.language || ""]).map(function (l) { return String(l).slice(0, 2).toLowerCase(); });
      var choix = voulues.filter(function (l) { return langues.indexOf(l) >= 0; })[0] || defaut;
      location.replace(choix + "/index.html" + location.hash);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=fr/index.html"></noscript>
</head>
<body>
  <p><a href="fr/index.html">Chaire ONU-Habitat</a></p>
</body>
</html>
