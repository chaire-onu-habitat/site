  <!-- =======================================================
       BONUS (optionnel) : toggle tactile accessible du sous-menu
       Fonctionne en complément du hover/focus-within CSS ;
       si le JS est désactivé, le menu reste utilisable au clavier
       et au survol.
       ======================================================= -->
  <script>
    // Le menu est construit par js/contenus.js depuis
    // data/structure/navigation.json : on attend qu'il soit prêt.
    document.addEventListener('navigation:prete', () => {
      const mobileQuery = window.matchMedia('(max-width: 850px)');
      const isMobile = () => mobileQuery.matches;

      // Délai avant fermeture desktop : si la souris ressort d'un
      // nav-item une fraction de seconde (micro zone morte entre deux
      // hitbox, changement de fenêtre de survol, etc.) avant d'entrer
      // dans le suivant, le mega-menu reste affiché sans clignoter.
      const CLOSE_DELAY = 120;
      let closeTimer = null;

      const items = Array.from(document.querySelectorAll('.nav-item'));
      const entries = items.map((item) => ({
        item,
        link: item.querySelector('.nav-link'),
        menu: item.querySelector('.mega-menu'),
      })).filter((e) => e.link && e.menu);

      entries.forEach(({ link }) => link.setAttribute('aria-expanded', 'false'));

      function setExpanded(entry, expanded) {
        entry.item.classList.toggle('is-open', expanded);
        entry.link.setAttribute('aria-expanded', String(expanded));
      }

      // ---- MOBILE : hauteur réelle animée (fluide, sans à-coups) ----
      function openMobile(entry) {
        entries.forEach((other) => {
          if (other !== entry && other.item.classList.contains('is-open')) {
            closeMobile(other);
          }
        });
        setExpanded(entry, true);
        entry.menu.style.maxHeight = entry.menu.scrollHeight + 'px';
      }

      function closeMobile(entry) {
        // Fixe la hauteur courante avant de repasser à 0 pour garantir
        // une transition animée (et pas un saut instantané depuis "auto").
        entry.menu.style.maxHeight = entry.menu.scrollHeight + 'px';
        requestAnimationFrame(() => {
          entry.menu.style.maxHeight = '0px';
        });
        setExpanded(entry, false);
      }

      // ---- DESKTOP : hover-intent, le menu reste ouvert en traversant les liens ----
      function openDesktop(entry) {
        clearTimeout(closeTimer);
        entries.forEach((other) => {
          if (other !== entry) setExpanded(other, false);
        });
        setExpanded(entry, true);
      }

      function scheduleCloseDesktop() {
        clearTimeout(closeTimer);
        closeTimer = setTimeout(() => {
          entries.forEach((entry) => setExpanded(entry, false));
        }, CLOSE_DELAY);
      }

      entries.forEach((entry) => {
        const { item, link, menu } = entry;

        item.addEventListener('mouseenter', () => {
          if (isMobile()) return;
          openDesktop(entry);
        });

        item.addEventListener('mouseleave', () => {
          if (isMobile()) return;
          scheduleCloseDesktop();
        });

        link.addEventListener('click', (e) => {
          if (!isMobile()) return; // desktop : comportement au survol géré ci-dessus
          e.preventDefault();

          const willOpen = !item.classList.contains('is-open');
          if (willOpen) {
            openMobile(entry);
          } else {
            closeMobile(entry);
          }

          // Évite que :focus-within ne maintienne visuellement le menu
          // ouvert après le tap, une fois la classe is-open retirée.
          link.blur();
        });
      });

      mobileQuery.addEventListener('change', (e) => {
        clearTimeout(closeTimer);
        entries.forEach((entry) => {
          setExpanded(entry, false);
          if (e.matches) {
            entry.menu.style.maxHeight = '0px';
          } else {
            entry.menu.style.maxHeight = '';
          }
        });
      });
    });
  </script>

<script>
    // Les diapositives sont construites par js/contenus.js à partir des
    // éléments choisis dans data/structure/accueil.json. Ce script
    // gère uniquement le défilement (auto, pastilles, flèches, swipe).
    document.addEventListener("carrousel:pret", (evt) => {

      const AUTOPLAY_DELAY = (evt.detail && evt.detail.delai) || 6000;

      const hero = document.querySelector(".hero");
      const dotsContainer = hero.querySelector(".hero-dots");
      const prevBtn = hero.querySelector(".hero-arrow--prev");
      const nextBtn = hero.querySelector(".hero-arrow--next");

      const slideEls = hero.querySelectorAll(".hero-slide");
      const dotEls = dotsContainer.querySelectorAll(".hero-dot");
      const total = slideEls.length;

      let current = 0;
      let timer = null;

      dotEls.forEach((dot, index) => dot.addEventListener("click", () => goToSlide(index)));

      /*
       * ---------------------------------------------------
       * Navigation
       * ---------------------------------------------------
       */

      function showSlide(index) {
        slideEls.forEach((el, i) => el.classList.toggle("is-active", i === index));
        dotEls.forEach((el, i) => el.classList.toggle("is-active", i === index));
        current = index;
      }

      function goToSlide(index) {
        showSlide((index + total) % total);
        restartAutoplay();
      }

      function nextSlide() {
        goToSlide(current + 1);
      }

      function prevSlide() {
        goToSlide(current - 1);
      }

      function startAutoplay() {
        clearInterval(timer);
        if (total > 1) timer = setInterval(nextSlide, AUTOPLAY_DELAY);
      }

      function restartAutoplay() {
        startAutoplay();
      }

      prevBtn.addEventListener("click", prevSlide);
      nextBtn.addEventListener("click", nextSlide);

      hero.addEventListener("mouseenter", () => clearInterval(timer));
      hero.addEventListener("mouseleave", startAutoplay);

      // Une seule actualité : pas de pastille
      if (total < 2) dotsContainer.hidden = true;

      /*
       * ---------------------------------------------------
       * Swipe tactile (mobile) : reproduit le comportement
       * des flèches précédent/suivant.
       * ---------------------------------------------------
       */

      const SWIPE_THRESHOLD = 40; // px minimum pour valider un swipe
      let touchStartX = 0;
      let touchStartY = 0;

      hero.addEventListener("touchstart", (e) => {
        const touch = e.changedTouches[0];
        touchStartX = touch.screenX;
        touchStartY = touch.screenY;
      }, { passive: true });

      hero.addEventListener("touchend", (e) => {
        const touch = e.changedTouches[0];
        const deltaX = touch.screenX - touchStartX;
        const deltaY = touch.screenY - touchStartY;

        // Ignore le swipe si le geste est surtout vertical
        // (l'utilisateur fait défiler la page, pas le carrousel).
        if (Math.abs(deltaX) < Math.abs(deltaY)) return;
        if (Math.abs(deltaX) < SWIPE_THRESHOLD) return;

        if (deltaX < 0) {
          nextSlide(); // swipe vers la gauche -> actualité suivante
        } else {
          prevSlide(); // swipe vers la droite -> actualité précédente
        }
      }, { passive: true });

      showSlide(0);
      startAutoplay();
    });
  </script>
